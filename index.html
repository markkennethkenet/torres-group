<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Purr'Coffee POS</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">

  <style>
  /* ===== THEME (light + dark colors) ===== */
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
    --bg: #fbe1cc;
    --panel: #fff4ea;
    --card: #fff;
    --ink: #3b2a20;
    --mute: #7a6455;
    --line: #f0d5be;
    --brand: #a0643a;
    --pill: #f4a46c;
    --pillink: #fff;
    --ok: #15803d;
    --okbg: #dcfce7;
    --err: #b91c1c;
    --errbg: #fee2e2;
    --btn2: #3b2a20;
    --btn2ink: #fff;
    --img: #d5d9dc;
  }

  @media (prefers-color-scheme:dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d1511;
      --panel: #2a1f19;
      --card: #35271f;
      --ink: #f7e9dc;
      --mute: #c9ae98;
      --line: #4a382d;
      --brand: #d39a6c;
      --pill: #e0905a;
      --pillink: #2a1f19;
      --ok: #4ade80;
      --okbg: #10331f;
      --err: #fca5a5;
      --errbg: #3a1518;
      --btn2: #f7e9dc;
      --btn2ink: #2a1f19;
      --img: #4a4540;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1d1511;
    --panel: #2a1f19;
    --card: #35271f;
    --ink: #f7e9dc;
    --mute: #c9ae98;
    --line: #4a382d;
    --brand: #d39a6c;
    --pill: #e0905a;
    --pillink: #2a1f19;
    --ok: #4ade80;
    --okbg: #10331f;
    --err: #fca5a5;
    --errbg: #3a1518;
    --btn2: #f7e9dc;
    --btn2ink: #2a1f19;
    --img: #4a4540;
  }

  html {
    scroll-padding-top: env(safe-area-inset-top,0px);
  }

  *,*:before,*:after {
    box-sizing: inherit;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 700 17px/1.35 Nunito,"Segoe UI",system-ui,sans-serif;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  /* ===== BASE + BUTTONS ===== */
  svg.i {
    width: 1em;
    height: 1em;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none;
  }

  button {
    font: inherit;
    font-weight: 800;
    color: inherit;
    cursor: pointer;
    min-height: 52px;
    min-width: 52px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: var(--card);
    padding: 0 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: transform .08s,filter .15s;
  }

  button:active {
    transform: scale(.95);
    filter: brightness(.93);
  }

  button:focus-visible,input:focus-visible {
    outline: 3px solid var(--brand);
    outline-offset: 2px;
  }

  button:disabled {
    opacity: .6;
    cursor: wait;
  }

  .pri {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
    font-size: 19px;
    min-height: 60px;
  }

  .out {
    border-color: var(--btn2);
    min-height: 60px;
    font-size: 19px;
  }

  .dis {
    background: var(--line);
    border-color: var(--line);
    color: var(--mute);
  }

  /* ===== APP SHELL + SIDEBAR ===== */
  .shell {
    max-width: 1400px;
    margin: 14px auto;
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 0;
    background: var(--panel);
    border-radius: 26px;
    overflow: hidden;
    min-height: calc(100vh - 28px);
    box-shadow: 0 10px 40px rgba(120,70,30,.15);
  }

  aside {
    padding: 22px 14px;
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: 800;
    padding: 0 10px 18px;
    color: var(--ink);
  }

  .brand svg {
    font-size: 30px;
    color: var(--brand);
  }

  .nav {
    justify-content: flex-start;
    border: 0;
    background: none;
    min-height: 54px;
    width: 100%;
    font-size: 17px;
    border-radius: 12px;
    position: relative;
  }

  .nav.on {
    background: color-mix(in srgb,var(--pill) 28%,var(--panel));
    border-left: 4px solid var(--brand);
  }

  .nav .bd {
    margin-left: auto;
    background: var(--pill);
    color: var(--pillink);
    border-radius: 50%;
    min-width: 26px;
    height: 26px;
    display: grid;
    place-items: center;
    font-size: 14px;
  }

  .content {
    padding: 20px 24px;
    min-width: 0;
  }

  /* ===== TOP BAR + SEARCH + STEPS ===== */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }

  .search {
    flex: 1;
    min-width: 200px;
    max-width: 560px;
    position: relative;
  }

  .search input {
    width: 100%;
    min-height: 54px;
    border-radius: 999px;
    border: 2px solid var(--line);
    background: var(--card);
    padding: 0 20px 0 50px;
    font: inherit;
    font-size: 18px;
    color: var(--ink);
  }

  .search svg {
    position: absolute;
    left: 18px;
    top: 17px;
    font-size: 20px;
    color: var(--mute);
  }

  .steps {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .steps span {
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 14px;
    border: 1px solid var(--line);
    color: var(--mute);
  }

  .steps .done {
    background: color-mix(in srgb,var(--pill) 25%,var(--panel));
    color: var(--ink);
  }

  .steps .on {
    background: var(--pill);
    color: var(--pillink);
    border-color: var(--pill);
  }

  h1,h2 {
    margin: 0;
    font-weight: 800;
  }

  h1 {
    font-size: 32px;
  }

  h2 {
    font-size: 28px;
  }

  .sub {
    color: var(--mute);
    margin: 6px 0 0;
  }

  /* ===== MENU SCREEN (products + cart) ===== */
  .cols {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
    align-items: start;
  }

  .pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin: 14px 0;
  }

  .pills button {
    border-radius: 999px;
    min-height: 48px;
    background: none;
    border-color: var(--line);
  }

  .pills .on {
    background: var(--pill);
    border-color: var(--pill);
    color: var(--pillink);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(225px,1fr));
    gap: 16px;
  }

  .pc {
    background: var(--card);
    border-radius: 20px;
    padding: 12px;
    border: 3px solid transparent;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .pc.in {
    border-color: var(--pill);
  }

  .img {
    height: 150px;
    border-radius: 14px;
    background: var(--img);
    overflow: hidden;
    display: grid;
    place-items: center;
  }

  .img svg {
    height: 100%;
    width: 100%;
  }

  .pn {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 6px;
    font-size: 19px;
    margin-top: 4px;
  }

  .pn span {
    color: var(--brand);
  }

  .desc {
    margin: 0;
    color: var(--mute);
    font-size: 14px;
    font-weight: 600;
    min-height: 38px;
  }

  .sz small {
    display: block;
    font-size: 14px;
    margin-bottom: 4px;
  }

  .sz div {
    display: flex;
    gap: 8px;
  }

  .sz button {
    min-height: 44px;
    border-radius: 999px;
    font-size: 15px;
    padding: 0 16px;
  }

  .sz .on {
    background: var(--pill);
    border-color: var(--pill);
    color: var(--pillink);
  }

  .ar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: auto;
    padding-top: 6px;
  }

  .st {
    display: flex;
    align-items: center;
    border: 2px solid var(--line);
    border-radius: 14px;
  }

  .st button {
    border: 0;
    background: none;
    min-width: 46px;
    min-height: 50px;
    padding: 0;
    font-size: 20px;
  }

  .st b {
    min-width: 22px;
    text-align: center;
  }

  .add {
    flex: 1;
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
    font-size: 16px;
    padding: 0 8px;
  }

  .cart {
    background: var(--card);
    border-radius: 20px;
    padding: 16px;
    position: sticky;
    top: 12px;
  }

  .cart h3 {
    margin: 0 0 12px;
    font-size: 22px;
  }

  .mode {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 4px;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 14px;
    padding: 4px;
    margin-bottom: 12px;
  }

  .mode button {
    flex-direction: column;
    gap: 2px;
    border: 0;
    background: none;
    min-height: 60px;
    font-size: 13px;
    padding: 0 4px;
  }

  .mode .on {
    background: var(--card);
    box-shadow: 0 1px 4px rgba(0,0,0,.18);
  }

  .mode svg {
    font-size: 20px;
  }

  .item {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }

  .item .th {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    overflow: hidden;
    background: var(--img);
  }

  .item .th svg {
    width: 100%;
    height: 100%;
  }

  .item b {
    font-size: 16px;
    display: block;
  }

  .item small {
    color: var(--mute);
    font-size: 14px;
    font-weight: 600;
    display: block;
  }

  .item .q {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 4px;
  }

  .item .q button {
    min-height: 44px;
    min-width: 44px;
    padding: 0;
    border-radius: 12px;
    font-size: 18px;
  }

  .item .q i {
    font-style: normal;
    min-width: 24px;
    text-align: center;
  }

  .item .rt {
    text-align: right;
  }

  .item .rt b {
    font-size: 17px;
  }

  .del {
    background: var(--errbg)!important;
    color: var(--err);
    border-color: var(--errbg)!important;
    margin-top: 6px;
  }

  .empty {
    text-align: center;
    color: var(--mute);
    padding: 30px 8px;
  }

  .empty svg {
    font-size: 40px;
    display: block;
    margin: 0 auto 8px;
  }

  .row2 {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    color: var(--mute);
  }

  .row2.g {
    color: var(--ink);
    font-size: 20px;
    border-top: 2px dashed var(--line);
    margin-top: 6px;
    padding-top: 12px;
  }

  .row2.g b {
    font-size: 26px;
  }

  .wide {
    width: 100%;
    margin-top: 10px;
  }

  /* ===== REVIEW SCREEN ===== */
  .panelbox {
    background: var(--card);
    border-radius: 20px;
    overflow: hidden;
    margin: 16px 0;
  }

  .tr {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    padding: 16px 22px;
    border-top: 1px solid var(--line);
    font-size: 19px;
    align-items: center;
  }

  .tr.h {
    background: var(--panel);
    border: 0;
    font-size: 13px;
    color: var(--mute);
    padding: 12px 22px;
  }

  .tr>*:not(:first-child) {
    text-align: right;
  }

  .tsum {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 22px;
    background: color-mix(in srgb,var(--pill) 22%,var(--card));
  }

  .tsum b {
    font-size: 40px;
    color: var(--brand);
  }

  .btns {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 16px;
  }

  @media (max-width:600px) {
    .btns {
      grid-template-columns: 1fr;
    }
  }

  .due {
    background: var(--card);
    border-radius: 16px;
    padding: 10px 20px;
    text-align: right;
  }

  .due small {
    display: block;
    font-size: 13px;
    color: var(--mute);
  }

  .due b {
    font-size: 34px;
    color: var(--brand);
  }

  /* ===== PAYMENT METHOD + CASH / QR / CARD ===== */
  .methods {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 16px;
    margin: 18px 0;
  }

  .method {
    flex-direction: column;
    min-height: 270px;
    border-radius: 24px;
    padding: 20px;
    font-weight: 600;
    color: var(--mute);
    gap: 4px;
    text-align: center;
    border: 3px solid transparent;
  }

  .method h3 {
    margin: 10px 0 2px;
    font-size: 26px;
    color: var(--ink);
    font-weight: 800;
  }

  .mic {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-size: 50px;
  }

  .two {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    align-items: start;
  }

  @media (max-width:860px) {
    .two {
      grid-template-columns: 1fr;
    }
  }

  .amt {
    background: var(--card);
    border-radius: 16px;
    padding: 16px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--mute);
    margin: 14px 0;
  }

  .amt b {
    font-size: 36px;
    color: var(--ink);
  }

  .field {
    background: var(--card);
    border: 3px solid var(--btn2);
    border-radius: 16px;
    padding: 12px 22px;
    font-size: 40px;
    font-weight: 800;
    min-height: 78px;
  }

  .field.bad {
    border-color: var(--err);
  }

  .field.z {
    color: var(--mute);
  }

  .lbl {
    display: block;
    font-size: 15px;
    margin: 12px 0 6px;
  }

  .quick {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 8px;
    margin: 6px 0 12px;
  }

  .quick button {
    padding: 0;
    min-height: 58px;
  }

  .quick .on {
    background: var(--btn2);
    color: var(--btn2ink);
    border-color: var(--btn2);
  }

  .chg {
    border-radius: 16px;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--card);
    color: var(--mute);
  }

  .chg.ok {
    background: var(--okbg);
    color: var(--ok);
  }

  .chg b {
    font-size: 36px;
  }

  .chg small {
    display: block;
    font-size: 14px;
    font-weight: 600;
  }

  .alert {
    display: flex;
    gap: 12px;
    align-items: center;
    background: var(--errbg);
    color: var(--err);
    border: 2px solid var(--err);
    border-radius: 14px;
    padding: 12px 16px;
    margin: 10px 0;
    font-size: 22px;
  }

  .alert div {
    font-size: 15px;
    font-weight: 600;
  }

  .alert b {
    font-size: 17px;
    display: block;
  }

  .pad {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;
  }

  .pad button {
    min-height: 92px;
    font-size: 32px;
    border-radius: 16px;
    padding: 0;
  }

  .pad .f {
    background: var(--panel);
    font-size: 20px;
  }

  .qrcard,.term {
    background: var(--card);
    border-radius: 24px;
    padding: 32px;
    text-align: center;
    display: grid;
    place-items: center;
  }

  .qrbox {
    width: min(290px,100%);
    aspect-ratio: 1;
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 12px;
    line-height: 0;
  }

  .qrbox svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .how {
    list-style: none;
    padding: 0;
    margin: 12px 0;
    display: grid;
    gap: 12px;
  }

  .how li {
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 18px;
  }

  .how b {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--btn2);
    color: var(--btn2ink);
    display: grid;
    place-items: center;
    flex: none;
  }

  .note {
    color: var(--mute);
    font-size: 15px;
    font-weight: 600;
    margin-top: 10px;
  }

  .proc {
    background: color-mix(in srgb,var(--pill) 20%,var(--card));
    border: 2px solid var(--pill);
    border-radius: 16px;
    padding: 14px 18px;
    margin: 12px 0;
  }

  .proc .bar {
    height: 12px;
    background: var(--card);
    border-radius: 6px;
    margin: 8px 0;
    overflow: hidden;
  }

  .proc .bar i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--brand);
    animation: fill 1.6s linear forwards;
  }

  @keyframes fill {
    to {
      width: 100%;
    }
  }

  .proc small {
    font-weight: 600;
  }

  /* ===== SUCCESS + RECEIPT + HISTORY ===== */
  .okc {
    background: var(--card);
    border-radius: 26px;
    padding: 32px;
    max-width: 760px;
    margin: 0 auto;
    text-align: center;
  }

  .bigok {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: #15803d;
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 58px;
    margin: 0 auto 12px;
  }

  .okc h2 {
    font-size: 40px;
    color: var(--ok);
  }

  .kv {
    border: 2px solid var(--line);
    border-radius: 16px;
    margin: 20px 0;
    overflow: hidden;
    text-align: left;
  }

  .kv div {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    font-size: 19px;
  }

  .kv div:first-child {
    border: 0;
    background: var(--panel);
  }

  .kv span {
    color: var(--mute);
  }

  .kv .m {
    font: 700 20px "JetBrains Mono",monospace;
  }

  .kv .g {
    color: var(--ok);
  }

  .okc button {
    width: 100%;
    margin-top: 10px;
  }

  .rc {
    background: #fff;
    color: #2b1d14;
    border-radius: 10px;
    padding: 30px;
    font: 500 16px/1.5 "JetBrains Mono",monospace;
    box-shadow: 0 8px 28px rgba(80,40,10,.2);
  }

  .rc h3 {
    margin: 0;
    text-align: center;
    font-size: 25px;
  }

  .rc .c {
    text-align: center;
    color: #6b5646;
    font-size: 13px;
  }

  .rc hr {
    border: 0;
    border-top: 2px dashed #b9a592;
    margin: 12px 0;
  }

  .rc .r {
    display: flex;
    justify-content: space-between;
    gap: 10px;
  }

  .rc small {
    display: block;
    color: #6b5646;
  }

  .rc .t {
    font-size: 23px;
    font-weight: 700;
  }

  .rc .okk {
    color: #15803d;
    font-weight: 700;
  }

  .side {
    padding-top: 30px;
  }

  .side p {
    color: var(--mute);
    font-size: 19px;
    margin: 10px 0 20px;
  }

  .side button {
    width: 100%;
    margin-bottom: 12px;
  }

  .hist {
    display: grid;
    gap: 10px;
    margin-top: 16px;
  }

  .hist button {
    justify-content: space-between;
    min-height: 72px;
    font-size: 18px;
    text-align: left;
    width: 100%;
  }

  @media (max-width:1100px) {
    .cols {
      grid-template-columns: 1fr;
    }
    .cart {
      position: static;
    }
  }

  @media (max-width:820px) {
    .shell {
      grid-template-columns: 1fr;
      margin: 0;
      border-radius: 0;
    }
    aside {
      flex-direction: row;
      flex-wrap: wrap;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 10px;
      align-items: center;
    }
    .brand {
      padding: 0 8px;
    }
    .nav {
      width: auto;
    }
  }

  /* ===== TOAST + PRINT + REDUCED MOTION ===== */
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom,0px));
    transform: translate(-50%,20px);
    background: #3b2a20;
    color: #fff;
    padding: 14px 24px;

    display: flex;
    gap: 10px;

    z-index: 50;

  }

  #toast.show {

      animation: none!important;
      transition: none!important;
    }
  }

  <script>
    "use strict";

    /* ===== utils ===== */
    const ICONS = {
      cup: "M4 8h13v8a4 4 0 01-4 4H8a4 4 0 01-4-4V8zM17 10h1a3 3 0 010 6h-1M8 2v3M12 2v3",

    const ic = n => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="${ICONS[n]}"/></svg>`;
    const Util = {

      }),

      ymd: d => d.getFullYear() + Util.pad(d.getMonth() + 1, 2) + Util.pad(d.getDate(), 2),
      toast(t, type = "success") {
        const e = document.getElementById("toast");
        e.innerHTML = ic(type === "success" ? "check" : "alert") + `<span>${t}</span>`;
        e.className = "show " + type;
        clearTimeout(Util._t);
        Util._t = setTimeout(() => e.className = "", 2400);
      }
    };

    /* ===== product data + drawn product images (inline SVG, no external files) ===== */
    const LARGE_EXTRA = 20;
    const PRODUCTS = [
      {
        id: 1,
        name: "Cappuccino",

        cat: "Coffee",
        sizes: 1,
        art: "cup",
        layers: [

      },

        ],

      },
      {

        name: "Americano",
        price: 80,

        sizes: 1,

        layers: [
          [30, 88, "#3a2218"]
        ],

      },
      {

        layers: [

        ],

      },
      {
        id: 5,
        name: "Choco Milk",
        price: 90,
        cat: "Non Coffee",
        sizes: 1,

        layers: [
          [30, 88, "#7a4a31"]
        ],

      },
      {
        id: 6,
        name: "Croissant",
        price: 85,

      },
      {
        id: 7,
        name: "Club Sandwich",
        price: 130,

        art: "sandwich",
        desc: "Chicken, egg, lettuce and tomato on toast."
      },
      {
        id: 8,

      },
      {

      {

      }
    ];
    const CATS = ["Coffee", "Non Coffee", "Food", "Snack", "Dessert"];
    function art(p) {
      const L = y => 30 + (y - 30) * 5 / 55, B = {
        cup: () => p.layers.map(([a, b, c]) => `<polygon points="${L(a)},${a} ${70 - (L(a) - 30)},${a} ${70 - (L(b) - 30)},${b} ${L(b)},${b}" fill="${c}"/>`).join("") +
          `<path d="M30 30h40l-5 56a5 5 0 01-5 4H40a5 5 0 01-5-4z" fill="rgba(255,255,255,.25)" stroke="#8d969c" stroke-width="2"/><rect x="42" y="50" width="10" height="10" rx="2" fill="#fff" opacity=".5" transform="rotate(12 47 55)"/><rect x="53" y="62" width="9" height="9" rx="2" fill="#fff" opacity=".45"/><path d="M56 30l6-22" stroke="#e9d9c6" stroke-width="3" stroke-linecap="round"/>`,
        croissant: () => `<path d="M15 62c4-24 22-34 35-34s31 10 35 34c-8-6-12-8-18-6-3-8-9-12-17-12s-14 4-17 12c-6-2-10 0-18 6z" fill="#d9954a"/><path d="M38 40l5 14M50 36v18M62 40l-5 14" stroke="#b9722e" stroke-width="3" stroke-linecap="round"/>`,
        sandwich: () => `<path d="M14 66L50 24l36 42z" fill="#e8c27c"/><path d="M20 66l30-34 30 34z" fill="#8fbf5a"/><path d="M26 66l24-26 24 26z" fill="#e5533d"/><path d="M14 66h72v8H14z" fill="#e8c27c"/>`,
        cookie: () => `<circle cx="50" cy="52" r="30" fill="#c58a4a"/><circle cx="40" cy="44" r="4" fill="#4a2c1a"/><circle cx="58" cy="40" r="4" fill="#4a2c1a"/><circle cx="52" cy="58" r="4" fill="#4a2c1a"/><circle cx="36" cy="60" r="3.5" fill="#4a2c1a"/><circle cx="64" cy="58" r="3.5" fill="#4a2c1a"/>`,
        cake: () => `<path d="M14 70L50 30l36 40z" fill="#f6dfa6"/><path d="M14 70h72v8H14z" fill="#d9a65c"/><path d="M50 30l36 40H50z" fill="#f0cd84"/><circle cx="50" cy="26" r="6" fill="#d33d5b"/>`,
        donut: () => `<circle cx="50" cy="52" r="32" fill="#e7b06b"/><circle cx="50" cy="50" r="30" fill="#f3a0b8"/><circle cx="50" cy="50" r="10" fill="var(--img)"/><path d="M30 38l5 3M62 32l-3 5M70 56l-5 2M40 70l3-5M58 70l-2-5" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`
      };
      return `<svg viewBox="0 0 100 100" role="img" aria-label="${p.name}">${B[p.art]()}</svg>`;
    }

    /* ===== cart logic (temporary order state; lines keyed by product + size) ===== */
    const Cart = {
      items: [],
      find(k) {
        return this.items.find(i => i.key === k);
      },
      add(p, size, qty) {
        const k = p.id + (size || ""), e = this.find(k);
        if (e)
          e.quantity += qty;
        else
          this.items.push({
            key: k,
            productId: p.id,
            name: p.name,
            size,
            price: p.price + (size === "Large" ? LARGE_EXTRA : 0),
            quantity: qty
          });
      },
      change(k, d) {
        const e = this.find(k);
        if (!e)
          return;
        e.quantity + d < 1 ? this.remove(k) : e.quantity += d;
      },
      remove(k) {
        this.items = this.items.filter(i => i.key !== k);
      },
      clear() {
        this.items = [];
      },
      subtotal: i => Util.cents(i.price) * i.quantity / 100,
      totalCents() {
        return this.items.reduce((s, i) => s + Util.cents(i.price) * i.quantity, 0);
      },
      total() {
        return this.totalCents() / 100;
      },
      count() {
        return this.items.reduce((s, i) => s + i.quantity, 0);
      },
      isEmpty() {
        return !this.items.length;
      }
    };

    /* ===== QR code (self-contained generator, no external library needed) ===== */
    /* QR_CONFIG: the ONLY thing you change to turn the simulation into a real payment QR.
       Leave paymentUrlTemplate empty = simulation payload (reference + amount as text).
       To use a real payment link, put it here. {ref} and {amount} are replaced automatically.
       Example: "https://your-payment-provider.example/pay?ref={ref}&amount={amount}" */
    const QR_CONFIG = {
      paymentUrlTemplate: ""
    };

    const QR = (() => {
      /* Error-correction level M. version -> [EC codewords per block, [[blocks, data codewords per block], ...]] */
      const BLOCKS = {
        1: [10, [[1, 16]]], 2: [16, [[1, 28]]], 3: [26, [[1, 44]]], 4: [18, [[2, 32]]], 5: [24, [[2, 43]]],
        6: [16, [[4, 27]]], 7: [18, [[4, 31]]], 8: [22, [[2, 38], [2, 39]]], 9: [22, [[3, 36], [2, 37]]], 10: [26, [[4, 43], [1, 44]]]
      };
      /* Alignment-pattern centre positions for each version */
      const ALIGN = { 1: [], 2: [6, 18], 3: [6, 22], 4: [6, 26], 5: [6, 30], 6: [6, 34], 7: [6, 22, 38], 8: [6, 24, 42], 9: [6, 26, 46], 10: [6, 28, 50] };
      /* The 8 standard mask patterns (true = flip the module) */
      const MASKS = [
        (r, c) => (r + c) % 2 === 0,
        (r, c) => r % 2 === 0,
        (r, c) => c % 3 === 0,
        (r, c) => (r + c) % 3 === 0,
        (r, c) => (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0,
        (r, c) => ((r * c) % 2) + ((r * c) % 3) === 0,
        (r, c) => (((r * c) % 2) + ((r * c) % 3)) % 2 === 0,
        (r, c) => (((r + c) % 2) + ((r * c) % 3)) % 2 === 0
      ];

      /* Reed-Solomon error correction over GF(256) */
      const EXP = [], LOG = [];
      for (let i = 0, x = 1; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11d; }
      for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
      const mul = (a, b) => a && b ? EXP[LOG[a] + LOG[b]] : 0;
      function rsEncode(data, n) {
        let g = [1];
        for (let i = 0; i < n; i++) {
          const ng = new Array(g.length + 1).fill(0);
          for (let j = 0; j < g.length; j++) { ng[j] ^= g[j]; ng[j + 1] ^= mul(g[j], EXP[i]); }
          g = ng;
        }
        const r = new Array(n).fill(0);
        for (const b of data) {
          const f = b ^ r[0];
          r.shift(); r.push(0);
          if (f) for (let i = 0; i < n; i++) r[i] ^= mul(g[i + 1], f);
        }
        return r;
      }

      /* Mask quality score: lower is better (the 4 standard penalty rules) */
      function penalty(m) {
        const n = m.length;
        let p = 0, dark = 0;
        for (let pass = 0; pass < 2; pass++) {
          const at = (a, b) => pass ? m[b][a] : m[a][b];
          for (let a = 0; a < n; a++) {
            let run = 1;
            for (let b = 1; b < n; b++) {
              if (at(a, b) === at(a, b - 1)) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1;
            }
            for (let b = 0; b + 10 < n; b++) {
              const s = [];
              for (let k = 0; k < 11; k++) s.push(at(a, b + k) ? 1 : 0);
              const t = s.join("");
              if (t === "10111010000" || t === "00001011101") p += 40;
            }
          }
        }
        for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
          if (m[y][x]) dark++;
          if (x + 1 < n && y + 1 < n && m[y][x] === m[y][x + 1] && m[y][x] === m[y + 1][x] && m[y][x] === m[y + 1][x + 1]) p += 3;
        }
        return p + Math.floor(Math.abs(dark * 100 / (n * n) - 50) / 5) * 10;
      }

      /* Turn text into a square matrix of true/false modules */
      function encode(text) {
        const bytes = Array.from(new TextEncoder().encode(text));
        const dataCap = v => BLOCKS[v][1].reduce((s, [n, d]) => s + n * d, 0);
        let v = 1;
        while (v <= 10 && bytes.length > dataCap(v) - (v < 10 ? 2 : 3)) v++;
        if (v > 10) throw new Error("QR payload too long");

        /* 1. Data bits: mode (byte), length, data, terminator, padding */
        const bits = [];
        const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
        put(4, 4);
        put(bytes.length, v < 10 ? 8 : 16);
        bytes.forEach(b => put(b, 8));
        const cap = dataCap(v) * 8;
        put(0, Math.min(4, cap - bits.length));
        while (bits.length % 8) bits.push(0);
        for (let pad = 0xEC; bits.length < cap; pad ^= 0xEC ^ 0x11) put(pad, 8);
        const cw = [];
        for (let i = 0; i < bits.length; i += 8) cw.push(parseInt(bits.slice(i, i + 8).join(""), 2));

        /* 2. Split into blocks, add Reed-Solomon error correction, interleave */
        const [eccLen, groups] = BLOCKS[v];
        const dBlocks = [], eBlocks = [];
        let pos = 0;
        for (const [n, d] of groups) for (let i = 0; i < n; i++) {
          const blk = cw.slice(pos, pos + d);
          pos += d;
          dBlocks.push(blk);
          eBlocks.push(rsEncode(blk, eccLen));
        }
        const out = [];
        const maxD = Math.max(...dBlocks.map(b => b.length));
        for (let i = 0; i < maxD; i++) dBlocks.forEach(b => { if (i < b.length) out.push(b[i]); });
        for (let i = 0; i < eccLen; i++) eBlocks.forEach(b => out.push(b[i]));
        const stream = [];
        out.forEach(b => { for (let i = 7; i >= 0; i--) stream.push((b >>> i) & 1); });

        /* 3. Fixed patterns: timing, 3 finder squares, alignment squares */
        const size = 17 + 4 * v;
        const mod = Array.from({ length: size }, () => Array(size).fill(false));
        const fn = Array.from({ length: size }, () => Array(size).fill(false));
        const set = (x, y, dark) => { mod[y][x] = dark; fn[y][x] = true; };
        for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
        const finder = (cx, cy) => {
          for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
            const x = cx + dx, y = cy + dy;
            if (x < 0 || y < 0 || x >= size || y >= size) continue;
            const d = Math.max(Math.abs(dx), Math.abs(dy));
            set(x, y, d !== 2 && d !== 4);
          }
        };
        finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
        const ap = ALIGN[v];
        ap.forEach((cy, i) => ap.forEach((cx, j) => {
          if ((i === 0 && j === 0) || (i === 0 && j === ap.length - 1) || (i === ap.length - 1 && j === 0)) return;
          for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(cx + dx, cy + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }));

        /* 4. Format info (error level + mask) and version info cells */
        const infoCells = mask => {
          const cells = [];
          let rem = mask;
          for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
          const fb = ((mask << 10) | rem) ^ 0x5412;
          const b = i => ((fb >>> i) & 1) === 1;
          for (let i = 0; i <= 5; i++) cells.push([8, i, b(i)]);
          cells.push([8, 7, b(6)], [8, 8, b(7)], [7, 8, b(8)]);
          for (let i = 9; i < 15; i++) cells.push([14 - i, 8, b(i)]);
          for (let i = 0; i < 8; i++) cells.push([size - 1 - i, 8, b(i)]);
          for (let i = 8; i < 15; i++) cells.push([8, size - 15 + i, b(i)]);
          cells.push([8, size - 8, true]);
          if (v >= 7) {
            let r2 = v;
            for (let i = 0; i < 12; i++) r2 = (r2 << 1) ^ ((r2 >>> 11) * 0x1F25);
            const vb = (v << 12) | r2;
            for (let i = 0; i < 18; i++) {
              const bit = ((vb >>> i) & 1) === 1, a = size - 11 + (i % 3), c = Math.floor(i / 3);
              cells.push([a, c, bit], [c, a, bit]);
            }
          }
          return cells;
        };
        infoCells(0).forEach(([x, y, d]) => set(x, y, d)); /* reserve these cells */

        /* 5. Place data bits in the zig-zag order */
        const raw = Array.from({ length: size }, () => Array(size).fill(false));
        let bi = 0, up = true;
        for (let c = size - 1; c > 0; c -= 2) {
          if (c === 6) c--;
          for (let i = 0; i < size; i++) {
            const r = up ? size - 1 - i : i;
            for (let k = 0; k < 2; k++) {
              const cc = c - k;
              if (!fn[r][cc]) raw[r][cc] = bi < stream.length ? stream[bi++] === 1 : false;
            }
          }
          up = !up;
        }

        /* 6. Try all 8 masks, keep the best-scoring one */
        let best = null, bestScore = Infinity;
        for (let mask = 0; mask < 8; mask++) {
          const m = mod.map(r => r.slice());
          for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x]) m[y][x] = raw[y][x] !== MASKS[mask](y, x);
          infoCells(mask).forEach(([x, y, d]) => { m[y][x] = d; });
          const s = penalty(m);
          if (s < bestScore) { bestScore = s; best = m; }
        }
        return { size, modules: best };
      }

      return {
        /* What the QR contains */
        payload(ref, amount) {
          const amt = Number(amount).toFixed(2);
          if (QR_CONFIG.paymentUrlTemplate) {
            return QR_CONFIG.paymentUrlTemplate.replace("{ref}", encodeURIComponent(ref)).replace("{amount}", amt);
          }
          return `PURRCOFFEE-SIM|${ref}|PHP ${amt}|NOT A REAL PAYMENT`;
        },
        /* Draw the matrix as an inline SVG (white background + 4-module quiet zone, as the QR standard requires) */
        svg(text) {
          try {
            const { size, modules } = encode(text);
            const q = 4;
            let d = "";
            for (let y = 0; y < size; y++) {
              for (let x = 0; x < size; x++) {
                if (!modules[y][x]) continue;
                let len = 1;
                while (x + len < size && modules[y][x + len]) len++;
                d += `M${x + q} ${y + q}h${len}v1h-${len}z`;
                x += len - 1;
              }
            }
            const n = size + q * 2;
            return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" role="img" aria-label="QR code for payment ${text.replace(/"/g, "")}"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#3b2a20"/></svg>`;
          }
          catch (e) {
            return `<div style="padding:24px;font:700 14px sans-serif;color:#b91c1c;line-height:1.4">QR code unavailable</div>`;
          }
        },
        encode
      };
    })();

    /* ===== transaction logic (separate from cart) ===== */
    const Tx = {
      seq: 0,
      used: new Set(),
      history: [],
      init() {
        try {
          const s = JSON.parse(localStorage.getItem("pos_tx") || "{}");
          if (s.day === Util.ymd(new Date())) {
            this.seq = s.seq || 0;
            (s.used || []).forEach(r => this.used.add(r));
          }
        }
        catch (e) { }
      },
      peekRef() {
        return `TXN-${Util.ymd(new Date())}-${Util.pad(this.seq + 1, 3)}`;
      },
      newRef() {
        let r;
        do {
          this.seq++;
          r = `TXN-${Util.ymd(new Date())}-${Util.pad(this.seq, 3)}`;
        } while (this.used.has(r));
        this.used.add(r);
        try {
          localStorage.setItem("pos_tx", JSON.stringify({
            day: Util.ymd(new Date()),
            seq: this.seq,
            used: [...this.used]
          }));
        }
        catch (e) { }
        return r;
      },
      complete(method, cashC, mode) {
        if (Cart.isEmpty())
          throw new Error("empty");
        const tc = Cart.totalCents(), cash = method === "Cash";
        const t = {
          transactionReference: this.newRef(),
          dateTime: new Date(),
          serviceMode: mode,
          items: Cart.items.map(i => ({
            name: i.name,
            size: i.size,
            price: i.price,
            quantity: i.quantity,
            subtotal: Cart.subtotal(i)
          })),
          total: tc / 100,
          paymentMethod: method,
          cashReceived: cash ? cashC / 100 : null,
          change: cash ? (cashC - tc) / 100 : null,
          status: "PAID"
        };
        this.history.unshift(t);
        return t;
      }
    };

    /* ===== payment logic ===== */
    const Payment = { check(s) {
        if (!/^\d{1,7}$/.test(s) || Number(s) <= 0)
          return { error: "invalid" };
        const c = Number(s) * 100, t = Cart.totalCents();
        return c < t ? {
          error: "short",
          short: (t - c) / 100
        } : {
          cents: c,
          change: (c - t) / 100
        };
      } };

    /* ===== receipt generation ===== */
    const Receipt = { html(t) {
        const rows = t.items.map(i => `<div class="r"><b>${i.name}${i.size ? ` (${i.size})` : ""}</b><span>${Util.peso(i.subtotal)}</span></div><small>${i.quantity} × ${Util.peso(i.price)}</small>`).join("");
        const cash = t.paymentMethod === "Cash" ? `<div class="r"><span>Cash received</span><span>${Util.peso(t.cashReceived)}</span></div><div class="r"><span>Change</span><span>${Util.peso(t.change)}</span></div>` : "";
        return `<div class="rc"><h3>PURR'COFFEE POS</h3><div class="c">Official Digital Receipt</div><hr>
      <div class="r"><span>Transaction</span><b>${t.transactionReference}</b></div><div class="r"><span>Date</span><span>${t.dateTime.toLocaleString("en-PH", {
          dateStyle: "long",
          timeStyle: "short"
        })}</span></div><div class="r"><span>Order type</span><span>${t.serviceMode}</span></div><hr>${rows}<hr>
      <div class="r t"><span>TOTAL</span><span>${Util.peso(t.total)}</span></div><div class="r"><span>Payment</span><span>${t.paymentMethod}</span></div>${cash}
      <div class="r"><span>Status</span><span class="okk">Payment Successful</span></div><hr><div class="c">Thank you! Come back soon.</div></div>`;
      } };

    /* ===== UI ===== */
    const STEP = {
      order: 1,
      review: 2,
      method: 3,
      cash: 3,
      qr: 3,
      card: 3,
      success: 4,
      receipt: 4,
      history: 0
    };
    const App = {
      screen: "order",
      cat: "Coffee",
      q: "",
      mode: "Dine in",
      sel: {},
      lastTx: null,
      from: "success",
      cashStr: "",
      processing: false,
      go(s) {
        this.screen = s;
        this.render();
        window.scrollTo(0, 0);
      },
      getSel(id) {
        return this.sel[id] || (this.sel[id] = {
          size: "Small",
          qty: 1
        });
      },
      render() {
        const n = STEP[this.screen];
        document.getElementById("side").innerHTML = `<div class="brand">${ic("cup")}Purr'Coffee</div>
        <button class="nav ${this.screen === "order" ? "on" : ""}" data-a="toOrder">${ic("menu")} Menu</button>
        <button class="nav ${this.screen === "review" ? "on" : ""}" data-a="toReview">${ic("bag")} My order${Cart.count() ? `<span class="bd">${Cart.count()}</span>` : ""}</button>
        <button class="nav ${this.screen === "history" ? "on" : ""}" data-a="toHistory">${ic("hist")} History</button>`;
        const steps = ["Order", "Review", "Payment", "Receipt"].map((l, i) => {
          const k = i + 1, done = this.screen === "success" ? k <= 3 : k < n;
          return `<span class="${k === n && this.screen !== "success" ? "on" : done ? "done" : ""}">${done ? "✓ " + l : k + " " + l}</span>`;
        }).join("");
        document.getElementById("top").innerHTML = this.screen === "order" ? `<div class="search">${ic("search")}<input id="q" type="search" placeholder="Search menu" value="${this.q.replace(/"/g, "&quot;")}" aria-label="Search menu"></div><div class="steps">${steps}</div>` : `<div class="steps">${steps}</div>`;
        document.getElementById("app").innerHTML = this["v_" + this.screen]();
        const q = document.getElementById("q");
        if (q)
          q.oninput = () => {
            this.q = q.value;
            document.getElementById("grid").innerHTML = this.gridHtml();
          };
      },
      gridHtml() {
        const s = this.q.trim().toLowerCase(), list = PRODUCTS.filter(p => s ? p.name.toLowerCase().includes(s) : p.cat === this.cat);
        if (!list.length)
          return `<div class="empty">No products found.<br>Try another name or category.</div>`;
        return list.map(p => {
          const v = this.getSel(p.id), inCart = Cart.items.some(i => i.productId === p.id), pr = p.price + (p.sizes && v.size === "Large" ? LARGE_EXTRA : 0);
          return `<div class="pc ${inCart ? "in" : ""}"><div class="img">${art(p)}</div><div class="pn"><span style="color:var(--ink)">${p.name}</span><span>${Util.peso(pr)}</span></div><p class="desc">${p.desc}</p>
        ${p.sizes ? `<div class="sz"><small>Size</small><div>${["Small", "Large"].map(z => `<button class="${v.size === z ? "on" : ""}" data-a="size" data-id="${p.id}" data-s="${z}">${z}${z === "Large" ? " +₱" + LARGE_EXTRA : ""}</button>`).join("")}</div></div>` : ""}
        <div class="ar"><div class="st"><button data-a="qm" data-id="${p.id}" aria-label="Less">${ic("minus")}</button><b>${v.qty}</b><button data-a="qp" data-id="${p.id}" aria-label="More">${ic("plus")}</button></div><button class="add" data-a="add" data-id="${p.id}">Add to Cart</button></div></div>`;
        }).join("");
      },
      cartBox() {
        const modes = [
          ["Dine in", "dine"],
          ["Take away", "take"],
          ["Delivery", "ride"]
        ];
        return `<div class="cart"><h3>Cart summary</h3><div class="mode">${modes.map(([m, i]) => `<button class="${this.mode === m ? "on" : ""}" data-a="mode" data-m="${m}">${ic(i)}${m}</button>`).join("")}</div>${Cart.isEmpty() ? `<div class="empty">${ic("cart")}<b>Your order is empty</b><br>Tap Add to Cart on a product.</div>` :
          Cart.items.map(i => {
            const p = PRODUCTS.find(x => x.id === i.productId);
            return `<div class="item"><div class="th">${art(p)}</div><div><b>${i.name}</b><small>${i.size ? i.size + " · " : ""}${Util.peso(i.price)} each</small><div class="q"><button data-a="dec" data-k="${i.key}" aria-label="Decrease ${i.name}">${ic("minus")}</button><i>${i.quantity}</i><button data-a="inc" data-k="${i.key}" aria-label="Increase ${i.name}">${ic("plus")}</button></div></div>
        <div class="rt"><b>${Util.peso(Cart.subtotal(i))}</b><br><button class="del" data-a="rem" data-k="${i.key}" aria-label="Remove ${i.name}">${ic("trash")}</button></div></div>`;
          }).join("")}
        <div class="row2"><span>Price</span><span>${Util.peso(Cart.total())}</span></div><div class="row2 g"><span>Grand total</span><b>${Util.peso(Cart.total())}</b></div>
        <button class="wide pri ${Cart.isEmpty() ? "dis" : ""}" data-a="toReview">Place an order</button></div>`;
      },
      v_order() {
        return `<h1>Coffee menu</h1><div class="pills">${CATS.map(c => `<button class="${!this.q && c === this.cat ? "on" : ""}" data-a="cat" data-c="${c}">${c}</button>`).join("")}</div><div class="cols"><div class="grid" id="grid">${this.gridHtml()}</div>${this.cartBox()}</div>`;
      },
      v_review() {
        return `<div style="max-width:1000px"><h1>Order summary</h1><p class="sub">${this.mode} · Check your items before paying. Tap Back to make changes — your items stay in the cart.</p>
      <div class="panelbox"><div class="tr h"><span>PRODUCT</span><span>QTY</span><span>UNIT PRICE</span><span>SUBTOTAL</span></div>
      ${Cart.items.map(i => `<div class="tr"><b>${i.name}${i.size ? ` (${i.size})` : ""}</b><b>${i.quantity}</b><span>${Util.peso(i.price)}</span><b>${Util.peso(Cart.subtotal(i))}</b></div>`).join("")}
      <div class="tsum"><div><b style="font-size:20px;color:var(--ink)">Total Amount</b><br><span style="color:var(--mute)">${Cart.count()} items</span></div><b>${Util.peso(Cart.total())}</b></div></div>
      <div class="btns"><button class="out" data-a="toOrder">${ic("left")} Back / Modify Order</button><button class="pri" data-a="toMethod">Proceed to Payment ${ic("right")}</button></div></div>`;
      },
      v_method() {
        const m = (k, i, t, d, bg, fg) => `<button class="method" data-a="pick" data-m="${k}"><span class="mic" style="background:${bg};color:${fg}">${ic(i)}</span><h3>${t}</h3>${d}</button>`;
        return `<div class="top" style="margin:0"><div><h1>How would you like to pay?</h1><p class="sub">Tap one of the options below.</p></div><div class="due"><small>AMOUNT DUE</small><b>${Util.peso(Cart.total())}</b></div></div>
      <div class="methods">${m("Cash", "cash", "Cash", "Enter the amount you are paying. Change is computed for you.", "#dcfce7", "#166534")}${m("QR Payment", "qr", "QR Payment", "Scan with a supported e-wallet or banking app.", "#dbeafe", "#1d4ed8")}${m("Card", "card", "Credit / Debit Card", "Tap, insert, or swipe your card at the reader.", "#ede9fe", "#6d28d9")}</div>
      <button class="out" data-a="toReview">${ic("left")} Back to Order</button>`;
      },
      v_cash() {
        const s = this.cashStr, amt = s ? Number(s) : 0, r = s ? Payment.check(s) : null, bad = r && r.error === "short", ok = r && !r.error;
        return `<div class="two"><div><h2>${ic("cash")} Cash Payment</h2><div class="amt"><span>Total amount</span><b>${Util.peso(Cart.total())}</b></div><span class="lbl">Amount paid</span>
      <div class="field ${bad ? "bad" : ""} ${s ? "" : "z"}">${Util.peso(amt)}</div>
      ${bad ? `<div class="alert">${ic("alert")}<div><b>Insufficient cash.</b>Please enter an amount equal to or greater than the total. You are short by ${Util.peso(r.short)}.</div></div>` : ""}
      <span class="lbl" style="color:var(--mute)">Quick amounts</span><div class="quick"><button data-a="quick" data-v="${Cart.total()}" class="${s && amt === Math.ceil(Cart.total()) ? "on" : ""}">Exact</button>${[200, 500, 1000].map(v => `<button data-a="quick" data-v="${v}" class="${s && amt === v ? "on" : ""}">₱${v.toLocaleString()}</button>`).join("")}</div>
      <div class="chg ${ok ? "ok" : ""}"><div>Change${ok ? `<small>${Util.peso(amt)} − ${Util.peso(Cart.total())}</small>` : ""}</div><b>${ok ? Util.peso(r.change) : "—"}</b></div></div>
      <div><div class="pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => `<button data-a="key" data-k="${d}">${d}</button>`).join("")}<button class="f" data-a="kclear">Clear</button><button data-a="key" data-k="0">0</button><button class="f" data-a="kback" aria-label="Backspace">${ic("back")}</button></div>
      <button class="wide pri" style="margin-top:12px" data-a="payCash">Pay Now</button><button class="wide out" data-a="toMethod">${ic("left")} Change payment method</button></div></div>`;
      },
      proc() {
        return `<div class="proc"><b>Processing payment…</b><div class="bar"><i></i></div><small>Please wait. Do not close this screen.</small></div>`;
      },
      v_qr() {
        const p = this.processing;
        return `<div class="two" style="margin-top:20px"><div class="qrcard"><div><div class="qrbox">${QR.svg(QR.payload(Tx.peekRef(), Cart.total()))}</div><div class="note">Ref: ${Tx.peekRef()}</div></div></div>
      <div><h2>${ic("qr")} QR Payment <small style="font-size:16px;color:var(--brand)">(simulation)</small></h2><div class="amt"><span>Amount to pay</span><b style="color:var(--brand)">${Util.peso(Cart.total())}</b></div>
      <ul class="how"><li><b>1</b>Scan the QR code using your supported payment application.</li><li><b>2</b>Check that the amount is ${Util.peso(Cart.total())} and approve it in your app.</li><li><b>3</b>Tap Confirm Payment below.</li></ul>${p ? this.proc() : ""}
      <div class="btns" style="grid-template-columns:1fr 1.4fr"><button class="out" ${p ? "disabled" : ""} data-a="toMethod">${ic("left")} Back</button><button class="pri" ${p ? "disabled" : ""} data-a="payQR">${ic("check")} Confirm Payment</button></div>
      <p class="note">Simulated payment — the amount paid will equal the total, with ₱0.00 change.</p></div></div>`;
      },
      v_card() {
        const p = this.processing;
        return `<div class="two" style="margin-top:20px"><div class="term"><svg viewBox="0 0 300 330" width="100%" style="max-width:320px" role="img" aria-label="Card reader"><rect x="40" y="40" width="190" height="270" rx="30" fill="#3b2a20"/><rect x="58" y="62" width="154" height="90" rx="10" fill="#1d1511"/><text x="72" y="95" fill="#f4a46c" font-size="12" font-family="monospace">${p ? "PROCESSING" : "READY"}</text><text x="72" y="130" fill="#fff" font-size="22" font-weight="800" font-family="sans-serif">${Util.peso(Cart.total())}</text><path d="M110 200a30 30 0 010 50M125 190a45 45 0 010 70" stroke="#f4a46c" stroke-width="6" fill="none" stroke-linecap="round"/><g transform="rotate(-12 200 110)"><rect x="150" y="60" width="130" height="85" rx="12" fill="#a0643a"/><rect x="165" y="80" width="26" height="20" rx="4" fill="#fcd34d"/><text x="165" y="125" fill="#fff" font-size="11" font-family="monospace">•••• •••• •••• 4821</text></g></svg></div>
      <div><h2>${ic("card")} Credit / Debit Card <small style="font-size:16px;color:var(--brand)">(simulation)</small></h2><div class="amt"><span>Amount due</span><b style="color:var(--brand)">${Util.peso(Cart.total())}</b></div>
      <h3 style="font-size:22px;margin:0 0 12px">Please tap, insert, or swipe your card.</h3>${p ? this.proc() : ""}
      <div class="btns" style="grid-template-columns:1fr 1.4fr"><button class="out" ${p ? "disabled" : ""} data-a="toMethod">${ic("left")} Back</button><button class="pri" ${p ? "disabled" : ""} data-a="payCard">Process Payment</button></div><p class="note">Simulation only. No real card data is read or stored.</p></div></div>`;
      },
      v_success() {
        const t = this.lastTx, c = t.paymentMethod === "Cash";
        return `<div class="okc"><div class="bigok">${ic("check")}</div><h2>Payment Successful</h2><p class="sub">Transaction completed successfully. Thank you!</p>
      <div class="kv"><div><span>Transaction Reference</span><b class="m">${t.transactionReference}</b></div><div><span>Payment method</span><b>${t.paymentMethod}</b></div><div><span>Amount paid</span><b>${Util.peso(c ? t.cashReceived : t.total)}</b></div><div><span>Transaction amount</span><b>${Util.peso(t.total)}</b></div>${c ? `<div><span>Change</span><b class="g">${Util.peso(t.change)}</b></div>` : ""}</div>
      <button class="pri" data-a="receipt">${ic("receipt")} View Receipt</button><button class="out" data-a="newTx">${ic("plus")} New Transaction</button></div>`;
      },
      v_receipt() {
        return `<div class="two" style="max-width:980px;margin:0 auto">${Receipt.html(this.lastTx)}<div class="side"><h1>Your receipt</h1><p>Keep this for your records. Tap New Transaction when you are done — your order and payment details will be cleared.</p>
      <button class="pri" data-a="newTx">${ic("plus")} New Transaction</button><button class="out" data-a="print">${ic("print")} Print Receipt</button><button class="out" style="border-color:var(--line)" data-a="${this.from === "history" ? "toHistory" : "toSuccess"}">${ic("left")} Back</button></div></div>`;
      },
      v_history() {
        const h = Tx.history;
        return `<h1>History</h1><p class="sub">Completed transactions this session.</p><div class="hist">${h.length ? h.map((t, i) => `<button data-a="open" data-i="${i}"><span>${t.transactionReference}<br><small style="color:var(--mute)">${t.dateTime.toLocaleTimeString("en-PH", { timeStyle: "short" })} · ${t.paymentMethod} · ${t.serviceMode}</small></span><b>${Util.peso(t.total)}</b></button>`).join("") : `<div class="empty">No transactions yet.</div>`}</div>`;
      },
      /* --- actions --- */
      guard() {
        if (Cart.isEmpty()) {
          Util.toast("Please add at least one product before proceeding.", "warn");
          return false;
        }
        return true;
      },
      finish(method, cashC) {
        if (this.processing)
          return;
        if (!this.guard())
          return this.go("order");
        const d = method === "Cash" ? 0 : 1600;
        this.processing = d > 0;
        this.render();
        setTimeout(() => {
          this.processing = false;
          try {
            this.lastTx = Tx.complete(method, cashC, this.mode);
            this.from = "success";
            Util.toast("Payment successful!");
            this.go("success");
          }
          catch (e) {
            Util.toast("Payment could not be completed.", "error");
            this.go("order");
          }
        }, d);
      },
      newTx() {
        Cart.clear();
        this.cashStr = "";
        this.lastTx = null;
        this.processing = false;
        this.sel = {};
        this.q = "";
        this.cat = "Coffee";
        this.mode = "Dine in";
        Util.toast("New transaction started — previous order cleared");
        this.go("order");
      },
      handle(e) {
        const b = e.target.closest("[data-a]");
        if (!b || this.processing)
          return;
        const id = Number(b.dataset.id), k = b.dataset.k;
        switch (b.dataset.a) {
          case "cat":
            this.cat = b.dataset.c;
            this.q = "";
            this.render();
            break;
          case "size":
            this.getSel(id).size = b.dataset.s;
            this.refreshGrid();
            break;
          case "qp": {
            const v = this.getSel(id);
            if (v.qty < 20)
              v.qty++;
            this.refreshGrid();
            break;
          }
          case "qm": {
            const v = this.getSel(id);
            if (v.qty > 1)
              v.qty--;
            this.refreshGrid();
            break;
          }
          case "add": {
            const p = PRODUCTS.find(x => x.id === id), v = this.getSel(id);
            Cart.add(p, p.sizes ? v.size : null, v.qty);
            Util.toast(`${p.name}${p.sizes ? " (" + v.size + ")" : ""} added to order.`);
            v.qty = 1;
            this.render();
            break;
          }
          case "mode":
            this.mode = b.dataset.m;
            this.render();
            break;
          case "inc":
            Cart.change(k, 1);
            this.render();
            break;
          case "dec": {
            const q = Cart.find(k)?.quantity;
            Cart.change(k, -1);
            this.render();
            if (q === 1)
              Util.toast("Item removed.", "warn");
            break;
          }
          case "rem":
            Cart.remove(k);
            this.render();
            Util.toast("Item removed.", "warn");
            break;
          case "toOrder":
            this.go("order");
            break;
          case "toReview":
            if (this.guard())
              this.go("review");
            break;
          case "toMethod":
            if (this.guard())
              this.go("method");
            break;
          case "toHistory":
            this.go("history");
            break;
          case "open":
            this.lastTx = Tx.history[Number(b.dataset.i)];
            this.from = "history";
            this.go("receipt");
            break;
          case "pick":
            this.cashStr = "";
            this.go(b.dataset.m === "Cash" ? "cash" : b.dataset.m === "Card" ? "card" : "qr");
            break;
          case "key":
            if (this.cashStr.length < 7) {
              this.cashStr = (this.cashStr + b.dataset.k).replace(/^0+/, "");
              this.render();
            }
            break;
          case "kclear":
            this.cashStr = "";
            this.render();
            break;
          case "kback":
            this.cashStr = this.cashStr.slice(0, -1);
            this.render();
            break;
          case "quick":
            this.cashStr = String(Math.ceil(Number(b.dataset.v)));
            this.render();
            break;
          case "payCash": {
            const r = this.cashStr ? Payment.check(this.cashStr) : { error: "invalid" };
            if (r.error === "invalid")
              return Util.toast("Please enter a valid amount.", "error");
            if (r.error === "short")
              return Util.toast("Insufficient cash.", "error");
            this.finish("Cash", r.cents);
            break;
          }
          case "payQR":
            this.finish("QR Payment");
            break;
          case "payCard":
            this.finish("Card");
            break;
          case "receipt":
            this.from = "success";
            this.go("receipt");
            break;
          case "toSuccess":
            this.go("success");
            break;
          case "print":
            try {
              window.print();
            }
            catch (x) {
              Util.toast("Printing is not available here.", "warn");
            }
            break;
          case "newTx":
            this.newTx();
            break;
        }
      },
      refreshGrid() {
        const g = document.getElementById("grid");
        g ? g.innerHTML = this.gridHtml() : this.render();
      }
    };
    Tx.init();
    document.addEventListener("click", e => App.handle(e));
    App.render();
  </script>
</body>
</html>
